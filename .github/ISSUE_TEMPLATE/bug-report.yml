name: Bug report
description: Report a reproducible CLI, evidence, installation, or interface problem.
body:
  - type: markdown
    attributes:
      value: "Use a minimal self-authored reproduction. Do not include private code, credentials, or sensitive logs. See SECURITY.md for vulnerability reporting."
  - type: input
    id: environment
    attributes:
      label: Environment
      description: RepoQuest version, OS, Python version, and host or browser where relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the exact command and a small sanitized case, if applicable.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
