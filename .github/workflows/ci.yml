name: Verify quests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python skills/repoquest/scripts/quest.py verify examples/borrowed-menu/case.json --trust-code
      - run: python skills/repoquest/scripts/quest.py build examples/borrowed-menu/case.json --output output/quest.html
      - run: python -m pip install .
      - run: repoquest build examples/borrowed-menu/case.json --output output/installed.html
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python scripts/package_release.py

  install-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install the skill into an empty project
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          mkdir "$RUNNER_TEMP/repoquest-install"
          cd "$RUNNER_TEMP/repoquest-install"
          npx --yes skills@1.7.0 add "$GITHUB_WORKSPACE" --skill repoquest --agent codex --copy --yes
          python .agents/skills/repoquest/scripts/quest.py build "$GITHUB_WORKSPACE/examples/borrowed-menu/case.json" --output quest.html
