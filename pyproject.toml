[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repoquest"
version = "0.1.0"
description = "Turn a reproducible bug into a self-contained debugging mystery."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
repoquest = "repoquest.cli:main"

[tool.setuptools]
package-dir = {"" = "skills/repoquest/scripts"}

[tool.setuptools.packages.find]
where = ["skills/repoquest/scripts"]

[tool.setuptools.package-data]
repoquest = ["page.html"]
